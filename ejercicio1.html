<!DOCTYPE html>
<html lang="es">
<head>

    <title>Registro de nombres📒</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="panel">
        <a class="back-link" href="index.html">← Volver al taller</a>
        <p class="eyebrow">Ejercicio 1</p>
